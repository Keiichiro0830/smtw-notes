<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>パラダイムシフト by AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050505;overflow:hidden;font-family:"Noto Sans JP","Yu Gothic","YuGothic","Hiragino Sans","Noto Sans CJK JP",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0 0 52px 0}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
.slide.active{opacity:1;visibility:visible;transition:opacity .45s ease}
.slide svg{width:100%;height:100%;display:block}
.tb{width:100%;height:100%;display:flex;flex-direction:column;overflow:visible;font-family:"Noto Sans JP","Yu Gothic","YuGothic","Hiragino Sans","Noto Sans CJK JP",sans-serif;word-break:normal;line-break:strict;overflow-wrap:anywhere}
.tb p{margin:0}
/* animations */
.slide .el{opacity:0}
.slide.active .el{animation-duration:.8s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,.84,.3,1);animation-delay:var(--d,0s)}
.slide.active .up{animation-name:up}
.slide.active .pop{animation-name:pop;transform-box:fill-box;transform-origin:center}
.slide.active .zoom{animation-name:zoom;animation-duration:1.4s;transform-origin:center}
.slide.active .draw{animation-name:draw;animation-duration:1s;stroke-dasharray:1;stroke-dashoffset:1}
.slide.active .draw[stroke-dasharray]{animation-name:fade}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}60%{opacity:1}to{opacity:1;transform:scale(1)}}
@keyframes zoom{from{opacity:0;transform:scale(1.4) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes draw{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.slide.active .el{animation:none!important;opacity:1}}
.static .slide .el{animation:none!important;opacity:1!important}
/* chrome */
#bar{position:fixed;z-index:10;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#0A0A0A;color:#A3A3A3;font-size:13px;border-top:1px solid #1f1f1f;user-select:none}
#bar button{background:none;border:1px solid #2a2a2a;color:#e5e5e5;height:34px;min-width:34px;padding:0 10px;border-radius:8px;font:inherit;cursor:pointer}
#bar button:hover{border-color:#FF5A1F;color:#fff}
#bar button[aria-pressed=true]{background:#FF5A1F;border-color:#FF5A1F;color:#0A0A0A;font-weight:700}
#count{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;color:#e5e5e5}
#prog{position:fixed;left:0;bottom:52px;height:3px;background:#FF5A1F;transition:width .4s ease;z-index:5}
.sp{flex:1}
#notes{position:fixed;left:0;right:0;bottom:52px;max-height:34vh;overflow:auto;background:rgba(10,10,10,.96);color:#e5e5e5;padding:16px 20px 20px;font-size:15px;line-height:1.75;border-top:1px solid #2a2a2a;transform:translateY(110%);visibility:hidden;transition:transform .3s ease,visibility 0s .3s;z-index:4}
#notes.open{transform:none;visibility:visible;transition:transform .3s ease}
#notes h2{font-size:12px;color:#FF5A1F;letter-spacing:.12em;margin-bottom:6px}
@media (max-width:600px){#bar .hide-s{display:none}}
</style></head>

<script>
const NOTES=["今日は、AIを実際に使い倒してみて感じている「価値観の変化」についてお話しします。", "まず問題意識から。大きくは、新しい技術が広まることで、人間の行動様態はどのように変わるのか。そしてそれをどのように測り、評価するのか。それに紐づいた直近の問題意識が、AIで必要とされるスキルは変わるのか、です。休日の実験、実務、そして川口塾での半年から考えていきます。", "休日は生成AIや自律型エージェントを動かして、WEBページ、Chrome拡張機能、アプリまで作りました。最近使い始めたGrokbotでは、こんなことまでほぼ自動で出来るのかと感動。実務でも自動化や契約書作成にAIを組み込んでいます。非エンジニアでも、PC上のことは大抵できる。ある種の万能感があります。", "使い込むほど、自分がやっていることはパターン認識と確率的オウムなのでは、と思えてきます。24時間働けるAIの方がコスパがいい。フィジカルAIなど、電力の観点からは人間のほうがコスパがいいという意見もありますが……。もしかして自分要らなくない？次何しよう？", "では、なぜ「自分要らない？」と感じたのか。ここから、最近思い始めていることを3つお話しします。", "PCの中のモノづくりは誰でも簡単に出来るようになった。これは人類の歴史で繰り返されてきた流れに似ているのではないか。作れば売れる→工場で大量生産→供給過多で売れなくなる→広告・コスト削減・オーダーメイドへ。", "学問もそれに合わせて発展してきたのでは。マーケティングは製品スペックの訴求から、行動経済学・心理学による行動変容へ。管理会計も、製造効率・原価管理から、組織の意思決定支援や動機づけへ。", "AIで計算や生成といったアウトプットのコストが極限まで下がるからこそ、焦点はそれを使う人間の文脈・意思決定・心理へシフトしている。では、この荒波を乗りこなすために必要なパーソナルスキルは何でしょうか。", "ファイナンス稲門会での学び。パーソナルスキルに関するWeb記事100件をNotebookLMに読み込ませて構造化しました。経済産業省とIPAのDX推進スキル標準と同じく、ヒューマンスキルとコンセプチュアルスキルの2領域・6項目に整理できます。", "データ分析・資料作成・競合分析といった従来型スキルはAIで平準化しました。解説本がなくても、本の目次構造が分かれば、同じ内容をWebで調べて本と同じことを自分で再現できてしまう。差がつくのは、自分だけの経験、特に失敗経験とありたい自分。AIは成功譚しか語らないからです。自分だけの経験は母集団からのサンプリング、ありたい自分は仮説思考に例えられそうです。", "誰もが同等の分析力を手に入れた世界で、最後に差がつくのは行動力と懐の広さ。この2つは並列ではなく、行動力があるからこそ懐の広さが身につく。行動力で一次情報を取りに行き、その結果、自分のサンプルプールが大きくなっていく。そして、その根っこで大事なのは人間力だと思っています。", "塾で教わったこの言葉の通り、渦中に飛び込むことでしか得られない情報があります。この半年間の川口塾で学んだ「まず中に入る」という姿勢の正しさを、身をもって実感しました。", "専門領域を越えて、Qiitaのエンジニア講演会、SAP関連のイベント、ファイナンス稲門会のイベント、その他各種イベントに参加しました。そこで分かったのは、外にいては触れられない一次情報があること。例えばAnthropicが提唱するAI協調モデル（4Dフレームワーク）。スタートアップの事例では、今まで最低5人で回していた業務量が1人とAIツールで代替できたと紹介されていた。FDEという、設計から導入までを一人で担当する職種も生まれている。AIをうまく使うTipsとしては、データをいかにシームレスにつなげ、AIでの分析につなげるか。そして、新しいシステム案件もヒアリングしながら作って「こんな感じですかね〜」で売れてしまうこと。", "企業の文脈でAIをうまく使っている人は、部長級のような会社のことをよく知っている人。これはサンプルプールが大きいという仮説を補強している。日本型のジョブローテーションがある体制は、意外とAI時代にマッチしている気がします。個人の文脈では、サンプルプールの拡大をやめると凝り固まった使えない人材になりかねない。リスキリングの重要性が謳われているのも納得できます。", "ここまでの実践で、いまはステージ1。社会をどうハックするかは、一次情報を取りに行くことで意外と手に入る。次は発信する側へ。WBSの講義での気づきで、発信者・代表の側に立つと質の高い情報がほぼ自動的に集まる。資格より信頼。そしてその先に、社会をどう変えるか。イメージは、領域と領域をつなぐ真ん中にいる人材。情報の非対称性をうまく活用したい。", "今日の問いに、いまの自分なりに答えます。もしかして自分要らなくない？確かに、作業者（バックオフィス）としての自分は要らなくなるかもしれない。ただしこれは自己喪失という悪い面だけではなく、デスクから解放され、新しい自分への進化につながる可能性があるとも考えられます。では乗りこなすスキルは何か。差がつくのは行動力、行動力があるからこそ身につく懐の広さ、そして人間力。川口先生のエピソードは、行動力と懐の広さがこの荒波を乗り越えるためのキーになっている、という主張を補強するものではないかと考えています。今の自分は先生が経験してきたことの途中にいるのかもしれない。直接会わなくてもよい時代に、会いに行く、直接話すというのはAIに代替されず残るし、大事な姿勢になっていく。実験的なアプローチをしている人に会いに行くことで得られることも多い。特に、自分で実験するほどのお金がないので。そして次は、発信する側、そして社会を変える側へ。そのために、人間力を磨いていく必要があります。", "最後に皆さんへの問いかけです。世間で言われているパーソナルスキルはありますが、AIによって必要とされるスキル（ハード・ソフト）は変わったと思いますか？もしあれば、そう感じるようになった経験を共有していただけるとうれしいです。", "イベントで学んだこと。1つ目、評価はトークン消費量ではなく、Anthropicの4D（委任・記述・識別・注意深さ）や批判的思考（協働推論）で差がつく。AIを使っているか、どれだけ動かしたかという作業量はもはや無価値で、何を作らせるか（仕様化・意図の定義）と、出てきたものが妥当か判断できるか（識別・推論）の2点だけが人間の実力として残る。2つ目、TOC理論の観点では、実装が10倍速くなっても、前後の意思決定やレビューが詰まっていれば全体のスループットは上がらない。これからの価値は手を動かして作る人ではなく、ボトルネックを解消して流れを通せる人に生まれる。判断待ちをなくすルール設計や、前後の文脈を統合して即断できる人が、組織でも個人事業でも主導権を握る。3つ目、業界トップクラスの技術者ですら、コード生成はほぼ100% AI。実装作業ができること自体の希少価値は崩壊した。彼らが売っているのはコードではなく、アーキテクチャの妥当性、システム全体への説明責任、障害時に引き受けるリスク。", "では、人間力とは何か。NotebookLMで93件のソースを整理しました。内閣府の人間力戦略研究会は、知的能力・社会対人関係力・自己制御の3要素で定義しています。能力は体・心・技の3層構造で捉えられ、AIで代替しやすいのは最上層の技。技は中立的な道具で、銃のように、それをどう使うかを決めるのは心です。知識処理をAIに任せて浮いたリソースを、人間力の磨き込みに投じる。心の整え方は3つ。挨拶、約束を守る、感謝を言葉にする、素直に教わる、自責で振り返るといった日々の行動。ネガティブな感情も否定せずに認めて、次ならどうするかを言葉にする振り返り。そして、迷ったときにあの人ならどうするかと問いかけるロールモデル。", "ゴールディ・チャン氏の『内向的な人のためのパーソナルブランディング』（2025年10月）によると、パーソナルブランディングの本質はSNSでの自己宣伝ではなく、自分が何を大切にしているかを定義・共有し、他者が自身の価値を正確に理解できるようにする意図的な行為。Harris Pollの調査では、70%の雇用主が応募者のSNSを審査すべきと考え、67%が評価でオンライン上の存在感を考慮しています。チャン氏自身もLinkedInで800以上の日々の動画投稿を続け、『LinkedInのオプラ』と称されるまでになりました。"];
const S=[...document.querySelectorAll('.slide')];const N=S.length;let cur=0;
const cnt=document.getElementById('count'),prog=document.getElementById('prog'),nt=document.getElementById('ntext'),np=document.getElementById('notes');
function show(i,replay){i=Math.max(0,Math.min(N-1,i));if(i===cur&&!replay&&S[i].classList.contains('active'))return;
 S.forEach(s=>s.classList.remove('active'));void S[i].offsetWidth;S[i].classList.add('active');cur=i;
 cnt.textContent=(i+1)+' / '+N;prog.style.width=((i+1)/N*100)+'%';nt.textContent=NOTES[i]||'（ノートなし）';
 try{history.replaceState(null,'','#slide-'+(i+1))}catch(e){}}
const go=d=>show(cur+d);
document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
document.getElementById('replay').onclick=()=>show(cur,true);
const ab=document.getElementById('anim');ab.onclick=()=>{const on=ab.getAttribute('aria-pressed')!=='true';ab.setAttribute('aria-pressed',on);document.body.classList.toggle('static',!on);show(cur,true)};
const nb=document.getElementById('nbtn');function tn(){const o=!np.classList.contains('open');np.classList.toggle('open',o);nb.setAttribute('aria-pressed',o)}nb.onclick=tn;
function fsT(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen()}catch(e){}}
document.getElementById('fs').onclick=fsT;
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
 if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){e.preventDefault();go(1)}
 else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();go(-1)}
 else if(k==='Home')show(0);else if(k==='End')show(N-1);else if(k==='n'||k==='N')tn();else if(k==='f'||k==='F')fsT();else if(k==='r'||k==='R')show(cur,true)});
document.getElementById('stage').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();go(e.clientX-r.left<r.width*0.3?-1:1)});
let tx=null,ty=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);tx=null},{passive:true});
function fromHash(){const m=/^#slide-(\d+)$/.exec(location.hash);return m?parseInt(m[1],10)-1:0}
addEventListener('hashchange',()=>{const i=fromHash();if(i!==cur)show(i)});
show(fromHash(),true);
</script></body></html>
